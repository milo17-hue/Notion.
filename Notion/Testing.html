<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="Css/style.css">
<link rel="stylesheet" href="Css/materia.css">
<script src="JS/materia.js" defer></script>
<title>Materia - Portafolio Daniela Cordoba Chavez</title>
</head>
<body>

<!-- ===== Iconos SVG reutilizables ===== -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
  <symbol id="logout" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M16 8l4 4-4 4M20 12H9"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
</svg>

<div class="layout">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="avatar">
      <svg viewBox="0 0 40 40" width="100%" height="100%">
        <defs><linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9c1ff"/><stop offset="1" stop-color="#e3cfff"/></linearGradient></defs>
        <rect width="40" height="40" fill="url(#av)"/>
        <ellipse cx="20" cy="22" rx="8" ry="9" fill="#fde8e2"/>
        <path d="M10 22c0-9 5-13 10-13s10 4 10 13c-2-6-6-8-10-8s-8 2-10 8z" fill="#2b3558"/>
      </svg>
    </div>
    <button class="active" data-tip="Inicio" data-href="index.html"><svg class="i"><use href="#home"/></svg></button>
    <button data-tip="Chat"><svg class="i"><use href="#chat"/></svg></button>
    <button data-tip="Contactos"><svg class="i"><use href="#user"/></svg></button>
    <button data-tip="Llamadas"><svg class="i"><use href="#phone"/></svg></button>
    <div class="sep"></div>
    <button data-tip="Favoritos"><svg class="i"><use href="#heart"/></svg></button>
    <button data-tip="Correo"><svg class="i"><use href="#mail"/></svg></button>
    <button data-tip="Ajustes"><svg class="i"><use href="#gear"/></svg></button>
    <div class="spacer"></div>
    <button data-tip="Salir"><svg class="i"><use href="#logout"/></svg></button>
  </aside>

  <main class="content doc-page">

    <!-- ===== Ruta de navegación ===== -->
    <div class="head reveal">
      <div>Portafolio / Cursos / <b id="crumb">Materia</b></div>
    </div>

    <!-- ===== Columna principal ===== -->
    <section class="main-col">

      <div class="title-row reveal" style="animation-delay:.05s">
        <a class="back-btn" href="index.html" title="Volver a los cursos"><svg class="i"><use href="#back"/></svg></a>
        <div>
          <h1 id="courseName">Materia</h1>
          <p id="courseCount">0 documentos</p>
        </div>
      </div>

      <label class="search reveal" style="animation-delay:.1s">
        <input type="text" id="docSearch" placeholder="Buscar documento..." autocomplete="off">
        <svg class="i"><use href="#search"/></svg>
      </label>

      <div class="chips reveal" id="chips" style="animation-delay:.15s"></div>

      <div class="docs reveal" id="docs" style="animation-delay:.2s"></div>
      <p class="empty" id="docEmpty">No se encontraron documentos 📄</p>
    </section>

    <!-- ===== Panel de información ===== -->
    <aside class="info reveal" style="animation-delay:.2s">
      <div class="row-title"><span>Información</span></div>

      <div class="card stat">
        <small>Documentos</small>
        <b id="statDocs">0</b>
      </div>
      <div class="card stat">
        <small>Tipos de archivo</small>
        <b id="statTypes">0</b>
      </div>

      <div class="card sub">
        <dl>
          <dt>Última modificación</dt><dd id="statLast">—</dd>
          <dt>Material más reciente</dt><dd id="statNewest">—</dd>
        </dl>
      </div>

      <div class="row-title" style="margin-top:6px"><span>Etiquetas</span></div>
      <div class="tags" id="tags"></div>
    </aside>

  </main>
</div>

</body>
</html>
